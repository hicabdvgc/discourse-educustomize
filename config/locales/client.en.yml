        "guide": {
          "course": {
            "title": "Set up a course",
            "step1": "You can begin by entering the course name and introduction and choosing its images. After saving the course, you can use Manage students to manage its membership.",
            "step2": "You can create an AI assistant by configuring its Prompt, Skills and authorized model, together with any tools or knowledge materials it needs. If several assistants need to work together, you can configure their relationship in Bloc.",
            "step3": "In a course Topic’s AI settings, you can bind the assistant and select its workflow and reviewing teacher. You need to save these settings before using them. Learning materials for students can be attached to discussion posts, while materials for AI retrieval need to be uploaded to the assistant."
          },
          "ai": {
            "title": "Configure an AI assistant",
            "step1": "The Prompt field describes the assistant’s role, tasks, teaching requirements and expected responses. You can use named Skills to organize separate sets of instructions. The platform adds those instructions to the Prompt in the order shown in the Skills list.",
            "step2": "You need to select an authorized model and enable the assistant before using it. You can also select the tools it needs and upload knowledge materials. Runtime and maintenance shows the indexing status of those materials. Advanced model parameters are optional, and their effect depends on the selected model’s support.",
            "step3": "You need to save the assistant before exporting its JSON configuration or using the updated settings. You can bind the assistant in a Topic’s AI settings. If you assign Delegates to it, the assistant acts as the Dais of a Bloc."
          },
          "bloc": {
            "title": "Configure a Bloc",
            "step1": "You can choose a Dais to coordinate the task, select the Delegates it needs and save the Bloc. The selected count shows how many Delegates are currently checked.",
            "step2": "The Edit Dais prompt and Edit Delegate buttons open the assistant editor, where you can define each assistant’s responsibilities. The Dais assigns tasks, the Delegates generate their contributions, and the Dais combines those contributions into a reply.",
            "step3": "You can select this Dais in a Topic’s AI settings and configure the teaching workflow and approval requirements there. Before switching assistants, you need to save or discard any pending edits."
          },
          "migration": {
            "title": "Move an AI configuration",
            "step1": "You can export a saved assistant’s configuration as JSON from its editor. The file contains its editable settings and the configurations of its Delegates. Knowledge files, credentials and Topic settings are managed separately and are excluded from the export.",
            "step2": "After selecting a JSON file, you can validate it and preview the configurations. The assistant list lets you switch between assistants to check their names, Prompts, Skills, tools and model mappings. The preview retains your edits until you create the copies or cancel the import.",
            "step3": "You need to resolve the reported errors and choose authorized destination models before creating the complete copy. Once the import is complete, you can upload the knowledge materials again and bind the new assistant to a Topic as needed."
          },
          "topics": {
            "title": "Configure, generate and review",
            "step1": "You need to select an assistant or Bloc, a teaching workflow and a reviewing teacher, then save the configuration. The readiness message explains which prerequisites still need attention.",
            "step2": "You can generate a response by selecting a student reply. Automatic replies respond to new student replies, and discussion memory supplies context from the current Topic. You need to save any pending configuration changes before generating a response.",
            "step3": "You can refresh the records to view generation results. The assigned reviewing teacher can edit and preview a draft, then approve it for publication or reject it. Regeneration starts a new attempt. After publication, you can open the published reply to check the result in the discussion."
          },
          "admin": {
            "title": "Prepare the teaching platform",
            "step1": "You can start by checking the dependencies and configuring the approved teacher group. The group must have administrators as its owners, and membership applications must require review. After preparing the teaching features, you can check each feature’s status on this page.",
            "step2": "You need to configure the model credentials and LLMs before authorizing course models in Plugin settings. Knowledge material indexing also requires an embedding configuration. Each of these configuration pages manages its own settings and credentials.",
            "step3": "After preparing the teaching workflow, you can open a course to configure its assistants and Topic policies. Runtime and maintenance, AI logs and usage records can help you investigate execution problems. You should check the retention settings before relying on exported data for your work."
          },
          "reports": {
            "title": "Export course data",
